# Configurations
title:            BeOps
longtitle:        "BeOps: shipping AI that stays up. Evaluation, cost and reliability, from an SRE's notebook."
author:           Kirill Kuklin
email:            beops.it@gmail.com
description: >
  BeOps: shipping AI that stays up. Evaluation, cost and reliability, from an SRE's notebook.

version:          1.0
gitbook_version:  3.2.3

url:              'https://NeverTheSame.github.io'
baseurl:          '/BeOps'
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

# Disqus comments
# disqushandler:            sighingnow

exclude:
  - _drafts
  # Defensive: never publish tooling even if it lingers in the working tree.
  # The automation now lives in the private beops-ops superproject.
  - posts-generator
  - configs
  - tests
  - docs
  - .github
  - .copilot
  - AGENTS.md
  - doppler.yaml
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md

collections:
  pages:
    output: true
    permalink: /:collection/:path/

ordered_collections:
  - posts
  - pages

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jemoji
